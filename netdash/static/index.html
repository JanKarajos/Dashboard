<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1714">
<title>Môj domov</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='7' fill='%232c7a47'/%3E%3Cpath d='M6 11.5 12 6.5l6 5V18H6z' fill='none' stroke='white' stroke-width='1.8' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="backdrop" aria-hidden="true"><i></i><i></i><i></i></div>

<nav class="rail" aria-label="Hlavná navigácia">
  <div class="rail-group" id="railMain"></div>
  <div class="rail-group" id="railMore"></div>
</nav>

<div class="shell">
  <header class="glass head">
    <div class="home-id">
      <div class="home-badge" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M4 11 12 4.5l8 6.5v9H4z"/><path d="M10 20v-5h4v5"/></svg>
        <span class="home-dot" id="homeDot"></span>
      </div>
      <div class="home-txt">
        <div class="home-name" id="homeName">Môj domov</div>
        <div class="home-sub" id="homeSub">Načítavam…</div>
      </div>
    </div>
    <label class="pill search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" type="search" placeholder="Hľadať zariadenie…" autocomplete="off">
    </label>
    <div class="head-actions">
      <div class="pill power" id="powerPill" title="Aktuálny príkon meraných zariadení" hidden>
        <svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg><span id="powerVal">0 W</span>
      </div>
      <button class="round" id="themeBtn" title="Prepnúť tému" aria-label="Prepnúť tému">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button class="round accent" id="scanBtn" title="Skenovať sieť" aria-label="Skenovať sieť">
        <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      </button>
    </div>
    <div class="scanbar" id="scanbar" hidden><div id="scanbarFill"></div></div>
  </header>

  <div class="scan-note" id="scanNote" hidden></div>
  <div class="demo-note" id="demoNote" hidden>Ukážkový režim – zariadenia sú vymyslené, ovládanie nič neodosiela.</div>

  <main id="page"></main>
</div>

<div class="dock" id="dock" hidden></div>

<div class="overlay" id="login" hidden>
  <form class="glass login-box" id="loginForm">
    <div class="home-badge big"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></div>
    <h2>Zadaj PIN</h2>
    <p>PIN sa zobrazil v okne programu na počítači, kde dashboard beží.</p>
    <input id="pinInput" inputmode="numeric" autocomplete="one-time-code" maxlength="12" placeholder="••••••" required>
    <button class="btn primary" type="submit">Prihlásiť</button>
    <div class="login-err" id="loginErr"></div>
  </form>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>
<script src="/app.js"></script>
</body>
</html>
