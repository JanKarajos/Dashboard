<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Moja sieť</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233b82f6' stroke-width='2.2' stroke-linecap='round'%3E%3Ccircle cx='12' cy='5' r='2.5'/%3E%3Ccircle cx='5' cy='19' r='2.5'/%3E%3Ccircle cx='19' cy='19' r='2.5'/%3E%3Cpath d='M12 7.5v4M12 11.5l-5.5 5.5M12 11.5l5.5 5.5'/%3E%3C/svg%3E">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand">
      <svg viewBox="0 0 24 24" class="brand-ico" aria-hidden="true"><circle cx="12" cy="5" r="2.5"/><circle cx="5" cy="19" r="2.5"/><circle cx="19" cy="19" r="2.5"/><path d="M12 7.5v4M12 11.5l-5.5 5.5M12 11.5l5.5 5.5"/></svg>
      <div>
        <h1>Moja sieť</h1>
        <div class="meta" id="meta">Načítavam…</div>
      </div>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="themeBtn" title="Prepnúť tému" aria-label="Prepnúť tému">
        <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <button class="btn primary" id="scanBtn">
        <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        <span>Skenovať</span>
      </button>
    </div>
  </div>
  <div class="progress" id="progress" hidden>
    <div class="progress-bar" id="progressBar"></div>
  </div>
</header>

<main>
  <div class="scan-status" id="scanStatus" hidden></div>
  <div class="demo-banner" id="demoBanner" hidden>Ukážkový režim – zariadenia sú vymyslené, ovládanie nič neodosiela.</div>

  <section class="stats" id="stats"></section>

  <div class="toolbar">
    <label class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" type="search" placeholder="Hľadať názov, IP, MAC, výrobcu…" autocomplete="off">
    </label>
    <div class="chips" id="chips" role="tablist"></div>
  </div>

  <section id="ctrlSection">
    <h2 class="sec-title">Ovládanie <span class="count" id="ctrlCount"></span></h2>
    <div class="grid ctrl-grid" id="ctrlGrid"></div>
  </section>

  <section id="allSection">
    <h2 class="sec-title">Všetky zariadenia <span class="count" id="allCount"></span></h2>
    <div class="grid dev-grid" id="devGrid"></div>
  </section>

  <div class="empty" id="empty" hidden></div>
</main>

<div class="overlay" id="login" hidden>
  <form class="login-box" id="loginForm">
    <svg viewBox="0 0 24 24" class="lock"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
    <h2>Zadaj PIN</h2>
    <p>PIN sa zobrazil v okne programu na počítači, kde dashboard beží.</p>
    <input id="pinInput" inputmode="numeric" autocomplete="one-time-code" maxlength="12" placeholder="••••••" required>
    <button class="btn primary" type="submit">Prihlásiť</button>
    <div class="login-err" id="loginErr"></div>
  </form>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>
<script src="/app.js"></script>
</body>
</html>
