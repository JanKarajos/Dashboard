<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Domov – TV</title>
<style>
  :root { --bg: #0b0d12; --tile: #171b24; --tile-2: #202634; --text: #eef0f4; --muted: #8d95a6; --accent: #4f8cff; --on: #f5b93a; --on-text: #1a1406; }
  * { box-sizing: border-box; }
  html { font-size: calc(9px + 0.55vw); }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, "Segoe UI", Roboto, Arial, sans-serif; overflow-x: hidden; }
  body { padding: 2.4rem 3.2rem 4rem; min-height: 100vh;
         background: radial-gradient(ellipse at 15% -10%, #1b2a4a 0%, rgba(11,13,18,0) 55%), radial-gradient(ellipse at 100% 0%, #2a1d3a 0%, rgba(11,13,18,0) 45%), var(--bg); }
  header { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 2.2rem; }
  .clock { font-size: 5.2rem; font-weight: 300; letter-spacing: -0.03em; line-height: 1; }
  .date { color: var(--muted); font-size: 1.5rem; margin-top: .5rem; }
  .side { text-align: right; }
  .weather { font-size: 2.4rem; font-weight: 300; }
  .weather small { display: block; font-size: 1.2rem; color: var(--muted); }
  .net { color: var(--muted); font-size: 1.15rem; margin-top: .5rem; }
  .net b { color: var(--text); font-weight: 600; }
  .rail { margin-bottom: 1.8rem; }
  .rail h2 { font-size: 1.35rem; font-weight: 600; margin: 0 0 .7rem; color: #cfd4de; }
  .rail h2 span { color: var(--muted); font-weight: 400; font-size: 1.1rem; margin-left: .8rem; }
  .tiles { display: flex; overflow-x: auto; overflow-y: visible; padding: .6rem .4rem .9rem; margin: -.6rem -.4rem 0; scrollbar-width: none; }
  .tiles::-webkit-scrollbar { display: none; }
  .tile { flex: 0 0 auto; width: 13.5rem; height: 7.6rem; margin-right: 1rem; border-radius: 1rem; border: 0; background: var(--tile);
          color: var(--text); text-align: left; padding: 1rem 1.1rem; font: inherit; cursor: pointer; position: relative;
          display: flex; flex-direction: column; justify-content: space-between; outline: none;
          transition: transform .12s ease-out, box-shadow .12s, background .12s; }
  .tile .t { font-size: 1.25rem; font-weight: 600; line-height: 1.2; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .tile .s { font-size: 1.05rem; color: var(--muted); }
  .tile .ico { font-size: 1.6rem; line-height: 1; }
  .tile.on { background: var(--on); color: var(--on-text); }
  .tile.on .s { color: rgba(26,20,6,.72); }
  .tile.app { background: var(--tile-2); }
  .tile.sm { width: 9rem; }
  .tile.info { cursor: default; background: transparent; border: 2px solid var(--tile-2); }
  .tile:focus { transform: scale(1.08); box-shadow: 0 0 0 .3rem #fff, 0 1rem 2.4rem rgba(0,0,0,.55); z-index: 2; }
  .tile.busy::after { content: ""; position: absolute; top: .9rem; right: .9rem; width: 1rem; height: 1rem; border-radius: 50%;
          border: .2rem solid rgba(255,255,255,.25); border-top-color: currentColor; animation: spin .8s linear infinite; }
  .swatch { width: 2rem; height: 2rem; border-radius: 50%; border: .15rem solid rgba(255,255,255,.5); }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hint { color: var(--muted); font-size: 1rem; margin-top: .4rem; }
  .toast { position: fixed; bottom: 1.2rem; right: 3.2rem; background: #d9463b; color: #fff; padding: .8rem 1.2rem; border-radius: .7rem; font-size: 1.15rem; max-width: 50%; }
  .login { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--bg); }
  .login form { text-align: center; }
  .login input { font-size: 3rem; width: 14rem; text-align: center; letter-spacing: .3em; padding: .6rem; border-radius: .8rem; border: 2px solid var(--tile-2); background: var(--tile); color: var(--text); }
  .login button { display: block; margin: 1.2rem auto 0; font-size: 1.4rem; padding: .7rem 2.4rem; border-radius: .8rem; border: 0; background: var(--accent); color: #fff; }
  .login input:focus, .login button:focus { outline: none; box-shadow: 0 0 0 .3rem #fff; }
  .empty { color: var(--muted); font-size: 1.4rem; margin-top: 3rem; }
</style>
</head>
<body>
<header>
  <div>
    <div class="clock" id="clock">--:--</div>
    <div class="date" id="date"></div>
  </div>
  <div class="side">
    <div class="weather" id="weather"></div>
    <div class="net" id="net"></div>
    <div class="hint">◀ ▲ ▼ ▶ pohyb · OK vybrať</div>
  </div>
</header>
<main id="rails"></main>
<div class="toast" id="toast" style="display:none"></div>
<div class="login" id="login" style="display:none">
  <form id="loginForm">
    <h1>Zadaj PIN</h1>
    <input id="pin" inputmode="numeric" maxlength="12" autocomplete="off">
    <button type="submit">Prihlásiť</button>
  </form>
</div>
<script src="/tv.js"></script>
</body>
</html>
